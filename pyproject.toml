[build-system]
requires = ["uv_build >=0.12.1, <0.13.0"]
build-backend = "uv_build"

[project]
name = "tqecd"
version = "0.2.1"
authors = [
    { name = "TQEC community", email = "tqec-design-automation@googlegroups.com" },
]
description = "Automatically find detectors in a topologically quantum error corrected computation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["topological quantum error correction", "qec", "detectors"]
requires-python = ">= 3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.22",
    "numpy>=1.24; python_version >= '3.11'",
    "numpy>=1.26; python_version >= '3.12'",
    "numpy>=2.1; python_version >= '3.13'",
    "stim>=1.15.0",
]

[project.urls]
Documentation = "https://tqec.github.io/tqecd/"
Repository = "https://github.com/tqec/tqecd"
Issues = "https://github.com/tqec/tqecd/issues"

[dependency-groups]
test = [
    "pytest<=9.1.0",
    "pytest-cov<=7.1.0",
]

docs = [
    "sphinx<=9.1.0",
    "myst-parser<=4.0.1",
    "pydata-sphinx-theme<=0.19.0",
    "nbsphinx<=0.9.7",
    "pandoc<=2.4",
    "jupyter<=1.1.1",
]

bench = [
    "pyinstrument<=5.1.1",
]

dev = [
    "pre-commit<=4.6.0",
    "ruff==0.17.0",
    "ty==0.0.86",
]

all = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "dev" },
    { include-group = "bench" },
]

[tool.coverage.run]
omit = ["*/*_test.py"]

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["I", "E", "W", "D", "F", "PL", "NPY", "N", "PERF", "RUF", "UP"]

ignore = [
    # D100/D104: public modules and packages don't all need docstrings yet.
    # D101/D105: class docstrings live on __init__; magic methods are self-explanatory.
    "D100", "D101", "D104", "D105",
    # D203/D213: incompatible with D211/D212, which we prefer.
    "D203", "D213",
    # D407: "====" under a section heading is flagged as a missing underline.
    "D407",
    # PLR09xx / PLR2004: too many branches/arguments/statements, magic values. Not a priority.
    "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # N802: function names with upper-case letters are intentional.
    "N802",
]

[tool.ruff.lint.per-file-ignores]
# Test functions are described by their names, so docstrings add nothing.
# N806: test variables are named after the Pauli operators they hold (X0Z1, Z0, ...).
"**/*_test.py" = ["D103", "N806"]
# Sphinx hook functions in the docs config don't need docstrings.
"docs/conf.py" = ["D103"]
